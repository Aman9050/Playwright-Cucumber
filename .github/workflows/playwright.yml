name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npm run test:sit
    - name: Generate Allure report
      if: always()
      run: |
        npx allure generate allure-results --clean -o allure-report
    - name: Validate Allure report output
      if: always()
      run: |
        if [ ! -f allure-report/index.html ]; then echo "ERROR: allure-report/index.html is missing"; exit 1; fi
        if [ ! -d allure-report/data ]; then echo "ERROR: allure-report/data is missing"; exit 1; fi
        if [ ! -d allure-report/widgets ]; then echo "ERROR: allure-report/widgets is missing"; exit 1; fi
        if [ ! -d allure-report/plugin ]; then echo "ERROR: allure-report/plugin is missing"; exit 1; fi
        echo "Allure report contents:"; find allure-report | sort
    - name: Package Allure report
      if: always()
      run: zip -r allure-report.zip allure-report
    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
    - name: Upload zipped Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-zip
        path: allure-report.zip
        retention-days: 30
    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
